name = "ohttp-relay"
main = "src/cloudflare.ts"
compatibility_date = "2025-03-10"
workers_dev = true
minify = true
upload_source_maps = true

# Keep top-level keys above this point: uncommenting the block below would
# otherwise pull whatever follows it into the [[services]] table.

# Uncomment to use a Cloudflare service binding to a co-located ohttp-gateway Worker.
# The service binding avoids an extra network hop and is available when both relay
# and gateway are deployed in the same Cloudflare account.
# [[services]]
# binding = "GATEWAY"
# service = "ohttp-gateway"

[observability]
enabled = true

[vars]
GATEWAY_URL = "https://gateway.ohttp.info/ohttp"
MAX_REQUEST_SIZE = "1048576"
CORS_ORIGIN = "*"
